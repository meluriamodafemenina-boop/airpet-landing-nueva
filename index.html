<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080808">

  <title>AirPet | Importadora El Rebaj&oacute;n</title>

  <meta
    name="description"
    content="AirPet GPS para mascotas. Promoci&oacute;n 2x1 por tiempo limitado."
  >

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    :root {
      --orange: #ff6a00;
      --orange2: #ff8a00;
      --black: #070707;
      --black2: #101010;
      --black3: #171717;
      --white: #ffffff;
      --gray: #a7a7a7;
      --line: #2b2b2b;
      --green: #1fad5c;
      --gold: #ffc21c;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 85% 8%, rgba(255,106,0,.12), transparent 23%),
        radial-gradient(circle at 10% 30%, rgba(255,106,0,.06), transparent 20%),
        var(--black);
      color: #fff;
      font-family: 'Montserrat', Arial, sans-serif;
      padding-bottom: 76px;
    }

    body.modal-open {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    img {
      max-width: 100%;
    }

    a {
      text-decoration: none;
    }

    .wrap {
      width: min(1160px, calc(100% - 28px));
      margin: auto;
    }

    /* HEADER */

    .top {
      position: sticky;
      top: 0;
      z-index: 60;
      background: rgba(7,7,7,.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1f1f1f;
    }

    .nav {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      font-size: 11px;
      letter-spacing: .12em;
      color: #ddd;
      font-weight: 700;
    }

    .brand b {
      display: block;
      font-size: 21px;
      color: white;
      letter-spacing: -.02em;
      margin-top: 2px;
    }

    .brand b::after {
      content: "";
      display: inline-block;
      width: 44px;
      height: 5px;
      border-radius: 10px;
      margin-left: 9px;
      background: var(--orange);
      vertical-align: middle;
    }

    .trend {
      border: 1px solid #383838;
      background: #151515;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 12px;
      color: #fff;
    }

    /* HERO */

    .hero {
      padding: 26px 0 34px;
    }

    .sales-poster {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: .92fr 1.08fr;
      min-height: 660px;
      background:
        linear-gradient(125deg, rgba(255,106,0,.07), transparent 35%),
        linear-gradient(145deg, #151515, #080808 70%);
      border: 1px solid #2c2c2c;
      border-radius: 26px;
      box-shadow: 0 40px 100px rgba(0,0,0,.5);
    }

    .sales-poster::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      right: -120px;
      top: -120px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255,106,0,.25),
        rgba(255,106,0,0) 65%
      );
      pointer-events: none;
    }

    .poster-copy {
      padding: 46px 38px 34px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      width: max-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--orange);
      color: #111;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
      margin-bottom: 18px;
    }

    .poster-copy h1 {
      margin: 0;
      font-size: clamp(44px, 6vw, 78px);
      line-height: .94;
      text-transform: uppercase;
      letter-spacing: -.05em;
    }

    .poster-copy h1 span {
      color: var(--orange);
    }

    .poster-sub {
      color: #b8b8b8;
      font-size: 16px;
      line-height: 1.6;
      max-width: 500px;
      margin: 18px 0 22px;
    }

    .rating {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .rating .stars {
      color: var(--gold);
      letter-spacing: 2px;
      font-size: 19px;
    }

    .rating strong {
      font-size: 14px;
      color: #fff;
    }

    .price-box {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      align-items: end;
      margin: 7px 0 18px;
    }

    .before {
      background: #151515;
      border: 1px solid #303030;
      border-radius: 12px;
      padding: 11px 12px;
    }

    .before span {
      display: block;
      color: #888;
      font-size: 10px;
      font-weight: 700;
    }

    .before s {
      color: #b7b7b7;
      font-size: 17px;
      font-weight: 800;
    }

    .now {
      background: linear-gradient(
        135deg,
        var(--orange2),
        var(--orange)
      );
      color: #111;
      border-radius: 15px;
      padding: 13px 18px;
      position: relative;
    }

    .now small {
      display: block;
      font-weight: 900;
      font-size: 11px;
      letter-spacing: .08em;
    }

    .now strong {
      display: block;
      font-size: clamp(38px, 5vw, 56px);
      line-height: 1;
      letter-spacing: -.04em;
    }

    .save {
      color: var(--orange2);
      font-weight: 800;
      margin-bottom: 18px;
      font-size: 13px;
    }

    .poster-benefits {
      display: grid;
      gap: 12px;
      margin: 12px 0 24px;
    }

    .poster-benefit {
      display: grid;
      grid-template-columns: 48px 1fr;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border: 1px solid #292929;
      border-radius: 14px;
      background: #111;
    }

    .poster-benefit img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 10px;
    }

    .poster-benefit b {
      display: block;
      font-size: 14px;
      color: #fff;
    }

    .poster-benefit span {
      color: #8f8f8f;
      font-size: 12px;
      line-height: 1.4;
    }

    .poster-visual {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 34px;
      min-width: 0;
    }

    .poster-visual::after {
      content: "";
      position: absolute;
      inset: auto 10% 8% 10%;
      height: 90px;
      background: radial-gradient(
        ellipse,
        rgba(255,106,0,.25),
        transparent 70%
      );
      filter: blur(12px);
      pointer-events: none;
    }

    .hero-product {
      width: min(100%, 610px);
      border-radius: 22px;
      position: relative;
      z-index: 2;
      box-shadow: 0 28px 70px rgba(0,0,0,.45);
    }

    .trust-strip {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: #2a2a2a;
      border-top: 1px solid #2b2b2b;
    }

    .trust-item {
      background: #0c0c0c;
      padding: 16px 10px;
      text-align: center;
      font-weight: 800;
      font-size: 12px;
      color: #efefef;
    }

    .trust-item span {
      color: var(--orange);
      margin-right: 5px;
    }

    /* BOTONES */

    .cta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 6px;
    }

    .btn {
      min-height: 54px;
      border: none;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 16px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      transition: .18s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .wa {
      background: var(--green);
      color: #fff;
    }

    .cod {
      background: linear-gradient(
        135deg,
        var(--orange2),
        var(--orange)
      );
      color: #111;
    }

    /* GALER&Iacute;A */

    .gallery-section {
      padding: 44px 0 64px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 24px;
    }

    .section-title .kicker {
      color: var(--orange);
      font-size: 11px;
      letter-spacing: .12em;
      font-weight: 900;
    }

    .section-title h2 {
      font-size: clamp(32px, 4vw, 48px);
      margin: 8px 0;
      letter-spacing: -.04em;
    }

    .section-title p {
      color: #9b9b9b;
      max-width: 680px;
      margin: 0 auto;
      line-height: 1.65;
    }

    .gallery-card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 24px;
      padding: 14px;
      max-width: 820px;
      margin: auto;
    }

    .main-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      border-radius: 18px;
    }

    .thumbs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-top: 12px;
      padding-bottom: 3px;
    }

    .thumb {
      flex: 0 0 82px;
      padding: 3px;
      background: #171717;
      border: 2px solid transparent;
      border-radius: 11px;
      cursor: pointer;
    }

    .thumb.active {
      border-color: var(--orange);
    }

    .thumb img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 7px;
      display: block;
    }

    /* BENEFICIOS */

    .benefits {
      padding: 74px 0;
      background: #0b0b0b;
      border-top: 1px solid #1d1d1d;
      border-bottom: 1px solid #1d1d1d;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 34px;
    }

    .cards article {
      min-height: 210px;
      padding: 23px;
      background: linear-gradient(145deg, #171717, #101010);
      border: 1px solid #2a2a2a;
      border-radius: 18px;
    }

    .benefit-title {
      display: flex;
      align-items: center;
      gap: 13px;
      color: #fff;
      font-size: 17px;
      line-height: 1.25;
    }

    .benefit-icon {
      width: 52px;
      height: 52px;
      object-fit: contain;
      flex-shrink: 0;
      border-radius: 12px;
    }

    .cards p {
      color: #9c9c9c;
      line-height: 1.65;
      font-size: 14px;
      margin-top: 16px;
    }

    /* DESCRIPCI&Oacute;N */

    .included {
      padding: 78px 0;
    }

    .included h2,
    .reviews h2,
    .faq h2,
    .final h2 {
      font-size: clamp(31px, 4vw, 48px);
      line-height: 1.05;
      letter-spacing: -.035em;
      margin: 0 0 12px;
    }

    .included p {
      max-width: 860px;
      color: #aaa;
      line-height: 1.8;
      font-size: 17px;
    }

    .included b {
      color: var(--orange);
    }

    /* TESTIMONIOS */

    .reviews {
      padding: 78px 0;
      background:
        radial-gradient(circle at 8% 50%, rgba(255,106,0,.08), transparent 24%),
        #0c0c0c;
    }

    .section-kicker {
      color: var(--orange);
      font-size: 11px;
      letter-spacing: .12em;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .sub {
      color: #9c9c9c;
      line-height: 1.65;
    }

    .reviews-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 32px;
    }

    .review-card {
      background: #151515;
      border: 1px solid #2b2b2b;
      border-radius: 18px;
      padding: 22px;
    }

    .review-card .stars {
      color: var(--gold);
      letter-spacing: 2px;
      font-size: 19px;
    }

    .review-card p {
      color: #aaa;
      line-height: 1.65;
    }

    .review-card b {
      display: block;
      color: #fff;
      margin-top: 12px;
    }

    .review-card span {
      color: var(--orange);
      display: block;
      margin-top: 4px;
      font-size: 13px;
    }

    /* FAQ */

    .faq {
      padding: 78px 0;
    }

    .faq details {
      background: #111;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 18px 20px;
      margin: 10px 0;
    }

    .faq summary {
      cursor: pointer;
      font-weight: 800;
      color: #fff;
    }

    .faq p {
      color: #9f9f9f;
      line-height: 1.6;
    }

    /* FINAL */

    .final {
      text-align: center;
      padding: 72px 0 110px;
      border-top: 1px solid #272727;
      background:
        linear-gradient(135deg, rgba(255,106,0,.22), transparent 40%),
        #080808;
    }

    .final .pill {
      display: inline-flex;
      background: var(--orange);
      color: #111;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
      padding: 9px 13px;
      border-radius: 999px;
    }

    .final h2 {
      margin-top: 18px;
      text-transform: uppercase;
      font-size: clamp(42px, 6vw, 70px);
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,.84);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      position: relative;
      width: min(680px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: #121212;
      border: 1px solid #333;
      border-radius: 22px;
      padding: 28px;
      color: #fff;
    }

    .close {
      position: absolute;
      right: 16px;
      top: 9px;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 36px;
      cursor: pointer;
    }

    .modal-card h2 {
      margin-top: 0;
      font-size: 30px;
    }

    .modal-card > p {
      color: #aaa;
    }

    .size-guide {
      width: 100%;
      border-radius: 14px;
      margin: 12px 0 20px;
    }

    .modal label {
      display: block;
      color: #ddd;
      font-weight: 700;
      font-size: 13px;
      margin: 13px 0;
    }

    .modal input,
    .modal select,
    .modal textarea {
      width: 100%;
      margin-top: 7px;
      padding: 14px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #090909;
      color: #fff;
      outline: none;
    }

    .modal input:focus,
    .modal select:focus,
    .modal textarea:focus {
      border-color: var(--orange);
    }

    /* STICKY */

    .sticky {
      display: none;
    }

    @media (max-width: 900px) {

      .sales-poster {
        grid-template-columns: 1fr;
      }

      .poster-visual {
        order: -1;
        padding: 22px 22px 6px;
      }

      .poster-copy {
        padding: 24px 22px 28px;
      }

      .poster-copy h1 {
        font-size: clamp(42px, 12vw, 66px);
      }

      .trust-strip {
        grid-template-columns: 1fr 1fr;
      }

      .cards {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {

      .wrap {
        width: min(100% - 20px, 1160px);
      }

      .nav {
        min-height: 64px;
      }

      .brand {
        font-size: 9px;
      }

      .brand b {
        font-size: 15px;
      }

      .trend {
        font-size: 9px;
        padding: 8px 9px;
      }

      .hero {
        padding-top: 16px;
      }

      .sales-poster {
        border-radius: 20px;
        min-height: 0;
      }

      .poster-visual {
        padding: 12px 12px 4px;
      }

      .hero-product {
        border-radius: 15px;
      }

      .poster-copy {
        padding: 22px 16px 24px;
      }

      .eyebrow {
        font-size: 9px;
        padding: 7px 10px;
      }

      .poster-copy h1 {
        font-size: 42px;
      }

      .poster-sub {
        font-size: 14px;
        margin: 14px 0 18px;
      }

      .price-box {
        grid-template-columns: 1fr;
      }

      .before {
        width: max-content;
      }

      .now strong {
        font-size: 44px;
      }

      .poster-benefit {
        grid-template-columns: 44px 1fr;
      }

      .poster-benefit img {
        width: 44px;
        height: 44px;
      }

      .cta-row {
        grid-template-columns: 1fr;
      }

      .trust-strip {
        grid-template-columns: 1fr 1fr;
      }

      .trust-item {
        font-size: 10
